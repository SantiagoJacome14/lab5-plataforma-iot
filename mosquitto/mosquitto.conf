# Broker de laboratorio. Anonimo a proposito: solo es alcanzable desde la red de
# Docker (y desde 127.0.0.1 del host, ver docker-compose.yml). Para exponerlo fuera
# de la VM, activa autenticacion (password_file) antes de abrir el puerto.
listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

apiVersion: 1

datasources:
  - name: InfluxDB-Lab5
    uid: influxdb-lab5
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: ${INFLUX_ORG}
      defaultBucket: lab5
      tlsSkipVerify: true
    secureJsonData:
      token: ${INFLUX_TOKEN}

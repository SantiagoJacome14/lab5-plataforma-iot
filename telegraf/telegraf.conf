# Puente MQTT -> InfluxDB. Telegraf es el suscriptor; Grafana nunca toca el broker.

[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["lab5/+/telemetry"]
  qos = 1
  client_id = "telegraf-lab5"
  persistent_session = true      # si Telegraf se reinicia, no se pierden mensajes QoS 1 pendientes
  topic_tag = ""                 # sin tag "topic": la serie queda solo con el tag device_id
  startup_error_behavior = "retry"   # si el broker aun no acepta conexiones, reintenta en vez de salir

  data_format = "json"
  name_override = "ambiental"    # measurement
  tag_keys = ["device_id"]
  json_time_key = "ts"           # marca de tiempo del publicador (epoch en ms)
  json_time_format = "unix_ms"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "lab5"
